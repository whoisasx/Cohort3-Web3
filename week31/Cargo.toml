cargo-features = ["edition2024"]
[package]
name = "week31"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib","lib"]
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

[dependencies]
borsh = { version = "1.5.7", features = ["derive"] }
borsh-derive = "1.5.7"
solana-program = "2.0"
